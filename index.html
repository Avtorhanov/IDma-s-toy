<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#241c6b">
<title>Волшебный стенд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a toy for toddlers, bright, round and wordless
   IDEA a busy-board stand with six little theatres; each act wakes up when its spots are tapped
   PICTURE the whole screen is the scene: sleepy stars, buds, balloons, bushes, shells, a birthday cake
   COLOUR every act owns one saturated sky; gold, pink, leaf green and sea blue accents; white sparkles
   TYPE Nunito 900 for the title and cheers, Nunito 800 for parent labels
   LAYOUT scene fills the screen; spots placed separately for landscape and portrait; tiny home and progress on top */
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden;background:#241c6b;color:#fff;font:800 16px/1.4 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#stage,#fx,#ui,#home{position:fixed;inset:0}
#stage{overflow:hidden}
#fx{pointer-events:none;z-index:5;overflow:hidden}
#ui{z-index:7;pointer-events:none}
#ui button{pointer-events:auto}
.scene{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;left:0;bottom:0;width:100%;display:block;pointer-events:none}
.p{position:absolute;left:var(--x);top:var(--y);width:var(--w);transform:translate(-50%,-50%)}
.p svg{display:block;width:100%;height:auto;overflow:visible}
.in,.k{position:relative}
.t{cursor:pointer;z-index:2}
.t::before{content:"";position:absolute;inset:-3vmin}
.deco{pointer-events:none}
.pt{position:absolute;display:block;pointer-events:none}
.pt svg{display:block;width:100%;height:100%;overflow:visible}
.dot{border-radius:50%}
.rect{border-radius:2px}
.star,.mini,#dots i.d{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.leaf{border-radius:0 80% 0 80%}
.ring{border-radius:50%;border:.7vmin solid #fff}
.bub{border-radius:50%;border:2px solid rgba(255,255,255,.85);background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.8),rgba(255,255,255,.12) 45%,rgba(255,255,255,.05))}
.comet{background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:99px;transform-origin:100% 50%}
.comet::after{content:"";position:absolute;right:-1.8vmin;top:50%;width:3.6vmin;height:3.6vmin;margin-top:-1.8vmin;background:#fff6c4;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.cheer{position:absolute;left:50%;top:38%;font:900 clamp(56px,17vmin,150px)/1 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;white-space:nowrap;text-shadow:0 .05em 0 #ff4d6d,0 .1em 0 #3a86ff,0 .15em 0 #ffd23f}
.tw{position:absolute;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
.mini{position:absolute;width:4.5vmin;height:4.5vmin;background:#ffe27a;animation:twinkle 2s ease-in-out infinite;pointer-events:none}
/* faces */
.sl{transition:opacity .25s}
.aw{opacity:0;transition:opacity .25s}
.on .aw{opacity:1}
.on .sl{opacity:0}
/* night */
.sb{fill:#686eb8;stroke:#686eb8;transition:fill .3s,stroke .3s}
.on .sb{fill:#ffd34d;stroke:#ffc21a}
.halo{opacity:0;transition:opacity .4s}
.on .halo{animation:halo 1.8s ease-in-out infinite}
.nstar .in{animation:float 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
.nstar.on .in{animation:pulse 1.6s ease-in-out infinite}
.moon .in{animation:float 6s ease-in-out infinite}
.z{font:900 13px Nunito,sans-serif;fill:#fff;opacity:0;animation:zz 2.4s ease-out infinite}
.on .zz{display:none}
/* garden */
.rays{transform-origin:50px 50px;animation:spin 26s linear infinite}
.cloud{position:absolute;left:0;pointer-events:none;animation:drift linear infinite}
.cloud svg{display:block;width:100%}
.rainbow path{stroke-dasharray:1 1.5;stroke-dashoffset:1.02;transition:stroke-dashoffset 1.4s ease-out}
.rainbow.on path{stroke-dashoffset:0}
.flower .in{animation:sway 4.5s ease-in-out infinite;animation-delay:var(--dl,0s);transform-origin:50% 100%}
.flower .k{transform-origin:50% 100%}
.bloom{transform:scale(0) rotate(-120deg);transform-origin:50px 55px;transition:transform .8s cubic-bezier(.34,1.56,.64,1)}
.on .bloom{transform:none}
.bud{transform-origin:50px 62px;transition:transform .3s,opacity .3s}
.on .bud{transform:scale(.2);opacity:0}
.w{transform-origin:30px 25px;animation:flap .22s ease-in-out infinite}
/* balloons */
.bal .in{animation:float var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.friend .in{animation:hop 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
/* bushes */
.bush .in{animation:rustle 5s ease-in-out infinite;animation-delay:var(--dl,0s);transform-origin:50% 100%}
.bush .k>svg,.gift .k>svg{position:relative}
.peek{transform-origin:60px 62px;animation:blink 3.2s infinite}
.on .peek{opacity:0}
.ani{position:absolute;left:18%;width:64%;bottom:42%;opacity:0;transform:translateY(40%) scale(.7);transition:transform .6s cubic-bezier(.34,1.7,.5,1),opacity .15s}
.ani svg{display:block;width:100%}
.on .ani{opacity:1;transform:translateY(-36%)}
/* sea */
.ray{position:absolute;top:-10%;height:78%;width:14vmax;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));transform:skewX(-18deg);animation:rayf 5s ease-in-out infinite alternate;pointer-events:none}
.weed{position:absolute;pointer-events:none;transform-origin:50% 100%;animation:sway2 3.2s ease-in-out infinite}
.weed svg{display:block;width:100%}
.lid{transform-origin:12px 60px;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.on .lid{transform:rotate(-34deg)}
.pearl,.glow{opacity:0;transform:scale(.3);transform-origin:60px 64px;transition:opacity .4s .15s,transform .5s .15s}
.on .pearl{opacity:1;transform:none}
.on .glow{transform:none;animation:halo 1.6s ease-in-out infinite}
.fishy .in{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
.dir svg{display:block;width:100%}
.spout{transform-origin:150px 24px;animation:spout .9s ease-in-out infinite}
/* party */
.bunt{position:absolute;top:0;left:0;width:100%;height:14vmin;pointer-events:none}
.table{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#f4c98f,#d99a5f);border-top:1.4vmin solid #ffe1b3;pointer-events:none}
.candle::before{inset:-5vmin -3vmin -2vmin}
.flame{transform-origin:15px 30px;transform:scale(0);transition:transform .45s cubic-bezier(.34,1.8,.6,1)}
.on .flame{transform:none}
.on .fl{transform-origin:15px 30px;animation:flick .35s ease-in-out infinite alternate}
.on .gl{animation:halo 1.3s ease-in-out infinite}
.gift .ani{left:16%;width:68%;bottom:34%;transform:translateY(45%) scale(.6);transition-delay:.2s}
.gift.on .ani{transform:translateY(-50%)}
.gift .lid{transform-box:fill-box;transform-origin:50% 50%;transition:none}
.gift.on .lid{transform:none}
/* ui */
#iris{position:fixed;left:50%;top:50%;width:300vmax;height:300vmax;border-radius:50%;z-index:8;pointer-events:none;display:none;transform:translate(-50%,-50%) scale(0)}
#homebtn{position:absolute;left:12px;top:12px;width:48px;height:48px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.2);display:grid;place-items:center;cursor:pointer}
#homebtn svg{width:40px;height:40px}
#homebtn .rg{stroke-dasharray:139;stroke-dashoffset:139}
#homebtn.hold .rg{stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
#dots{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px}
#dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.38)}
#dots i.c{background:#fff;transform:scale(1.35)}
#dots i.d{width:16px;height:16px;border-radius:0;background:#ffd34d}
#replay{position:absolute;left:50%;top:21%;width:min(22vmin,170px);aspect-ratio:1;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:radial-gradient(circle at 36% 30%,#fff2a8,#ffc21a 70%);box-shadow:0 1.2vmin 0 #d98900;transform:translate(-50%,-50%) scale(0);transition:transform .5s cubic-bezier(.34,1.7,.5,1);cursor:pointer}
#replay.show{transform:translate(-50%,-50%) scale(1)}
#replay svg{width:66%;height:66%;display:block;animation:spin 3s linear infinite}
#home{z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.6vmin,20px);padding:16px;background:radial-gradient(120% 90% at 50% 18%,#ffd84d 0%,#ff8db8 48%,#7a5cff 100%);transition:opacity .45s;overflow:hidden}
#home.hide{opacity:0;pointer-events:none}
#home h1{margin:0;font:900 clamp(32px,7.5vmin,58px)/1.05 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:-.01em;text-align:center;text-wrap:balance;text-shadow:0 .05em 0 #e2457f,0 .1em 0 #5b3cc4}
#home p{margin:0;max-width:30em;text-align:center;font-size:clamp(14px,2.4vmin,17px);color:#3b1d5e;text-wrap:balance}
#play{width:clamp(104px,32vmin,230px);aspect-ratio:1;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,#fff6b8,#ffd34d 55%,#ffb703);box-shadow:0 1.4vmin 0 #d98900;cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
#play svg{width:84%;height:84%;display:block}
.hdeco{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.hdeco .in{animation:float 4.2s ease-in-out infinite}
.hdeco svg{display:block;width:100%;height:auto}
@media (orientation:portrait){.hdeco.side{display:none}}
#play:active{transform:translateY(1vmin)}
.lbl,.note{font-size:14px;color:#3b1d5e}
.note{font-size:13px;opacity:.85;text-align:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{width:clamp(46px,8.5vmin,62px);aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:rgba(255,255,255,.5);padding:8px;cursor:pointer;display:grid;place-items:center}
.chip svg{width:100%;height:100%;display:block}
.chip.sel{background:#fff;border-color:#7a5cff}
.chip:focus-visible,.opt:focus-visible,#play:focus-visible{outline:3px solid #fff;outline-offset:3px}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.opt{min-height:44px;padding:0 16px;border:0;border-radius:22px;background:rgba(255,255,255,.75);color:#3b1d5e;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer}
.opt svg{width:22px;height:22px}
@media (max-height:460px){#home p,.note{display:none}}
/* motion */
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.4vmin) rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes halo{0%,100%{opacity:.18}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(130vw)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sway2{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes rustle{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}92%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-22px);opacity:0}}
@keyframes hop{0%,78%,100%{transform:translateY(0)}86%{transform:translateY(-22%)}93%{transform:translateY(0) scale(1.06,.94)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5vmin,-1.6vmin)}}
@keyframes rayf{from{opacity:.3}to{opacity:.85}}
@keyframes spout{0%,100%{transform:scale(.6)}50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.in,.cloud,.rays,.tw,.weed,.ray,#play,#replay svg{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="pg" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fbeaff"/><stop offset="1" stop-color="#d4bdf0"/></radialGradient></defs></svg>
<div id="stage"></div>
<div id="fx"></div>
<div id="iris"></div>
<div id="ui">
  <button id="homebtn" aria-label="В меню: удерживайте секунду"><svg viewBox="0 0 48 48"><circle class="rg" cx="24" cy="24" r="22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" transform="rotate(-90 24 24)"/><path d="M14 23 L24 14 L34 23 V34 H27 V27 H21 V34 H14Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <div id="dots"></div>
  <button id="replay" aria-label="Ещё раз"><svg viewBox="0 0 100 100"><path d="M78 50 A28 28 0 1 1 64 25.8" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M56 12 L80 24 L58 40Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></button>
</div>
<div id="home">
  <h1>Волшебный стенд</h1>
  <p>Нажимай на звёздочки, бутоны, шарики и кустики, и всё оживает. После каждого акта открывается новый.</p>
  <button id="play" aria-label="Играть"></button>
  <div class="lbl">Начать с акта</div>
  <div class="chips" id="chips"></div>
  <div class="opts">
    <button class="opt" id="snd"></button>
    <button class="opt" id="fs"><svg viewBox="0 0 24 24" fill="none" stroke="#3b1d5e" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>На весь экран</button>
  </div>
  <div class="note">Вернуться в меню: удерживайте домик в углу</div>
</div>
<script>
{
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const U=()=>Math.min(innerWidth,innerHeight)/100;
const stage=$('#stage'),fx=$('#fx');
const PAL=['#ff4d6d','#ff9f1c','#ffd23f','#3ec46d','#3a86ff','#9b5de5','#ff6fb5','#4dd8e6'];
const GOLD=['#ffd34d','#fff3b0','#ffffff','#ffb703'];
const HEARTS=['#ff5d8f','#ff8fab','#ff4d6d','#ffc2d6'];
let portrait=innerHeight>innerWidth,cur=0,sel=0,SC=null,SEL=null,targets=[],done=0,busy=false,party=false,started=false,lastAct=0,timers=[],muted=false;

/* ---------- helpers ---------- */
function mk(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function place(e){const v=(portrait?e.dataset.p:e.dataset.l).split(',').map(Number);e.style.setProperty('--x',v[0]+'%');e.style.setProperty('--y',v[1]+'%');if(v[2])e.style.setProperty('--w',v[2]+'vmin')}
function spot(e,L,P){e.dataset.l=L.join(',');e.dataset.p=(P||L).join(',');place(e);return e}
function piece(parent,cls,html,L,P){const p=mk('div','p '+(cls||''),parent);const i=mk('div','in',p);p._k=mk('div','k',i,html);if(typeof L==='string')p.style.cssText=L;else spot(p,L,P);return p}
function later(f,ms){const id=setTimeout(f,ms);timers.push(id);return id}
function every(f,ms){const id=setInterval(f,ms);timers.push(id);return id}
function clearTimers(){timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[]}
function box(el,fx0=.5,fy0=.5){const r=el.getBoundingClientRect();return [r.left+r.width*fx0,r.top+r.height*fy0]}
function fpt(t){return box(t.k,t.f[0],t.f[1])}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function starPath(cx,cy,r1,r2){let d='';for(let i=0;i<10;i++){const r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/5;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}return d+'Z'}
function face(cx,cy,r,ink,sleepy=true){const e=r*.32,w=(r*.1).toFixed(2),q=(v)=>v.toFixed(1);
  let s='<g>';
  if(sleepy)s+=`<g class="sl"><path d="M${q(cx-e-r*.17)} ${q(cy)} q${q(r*.17)} ${q(r*.17)} ${q(r*.34)} 0 M${q(cx+e-r*.17)} ${q(cy)} q${q(r*.17)} ${q(r*.17)} ${q(r*.34)} 0" stroke="${ink}" stroke-width="${w}" fill="none" stroke-linecap="round"/><path d="M${q(cx-r*.1)} ${q(cy+r*.4)} h${q(r*.2)}" stroke="${ink}" stroke-width="${w}" stroke-linecap="round"/></g>`;
  s+=`<g class="${sleepy?'aw':''}"><circle cx="${q(cx-e)}" cy="${q(cy)}" r="${q(r*.13)}" fill="${ink}"/><circle cx="${q(cx+e)}" cy="${q(cy)}" r="${q(r*.13)}" fill="${ink}"/><circle cx="${q(cx-e+r*.05)}" cy="${q(cy-r*.05)}" r="${q(r*.045)}" fill="#fff"/><circle cx="${q(cx+e+r*.05)}" cy="${q(cy-r*.05)}" r="${q(r*.045)}" fill="#fff"/><circle cx="${q(cx-r*.6)}" cy="${q(cy+r*.28)}" r="${q(r*.14)}" fill="#ff7aa8" opacity=".55"/><circle cx="${q(cx+r*.6)}" cy="${q(cy+r*.28)}" r="${q(r*.14)}" fill="#ff7aa8" opacity=".55"/><path d="M${q(cx-r*.24)} ${q(cy+r*.3)} q${q(r*.24)} ${q(r*.28)} ${q(r*.48)} 0" stroke="${ink}" stroke-width="${w}" fill="none" stroke-linecap="round"/></g></g>`;
  return s}

/* ---------- drawings ---------- */
const AN={
  bunny:{fur:'#f6f2f8',ear:'tall',in:'#ffb3c7',nose:'#ff7aa8',muz:'#ffffff'},
  bear:{fur:'#b0703f',ear:'round',in:'#e3b48a',nose:'#3b2547',muz:'#e7c39c'},
  fox:{fur:'#f2862e',ear:'pointy',in:'#ffe1c4',nose:'#3b2547',muz:'#fff4ea'},
  hedgehog:{fur:'#ecd0a8',ear:'spikes',in:'#7a5638',nose:'#3b2547',muz:'#f8e4c6'},
  frog:{fur:'#6fcf5a',ear:'frog',in:'#fff'},
  chick:{fur:'#ffd93b',ear:'tuft',in:'#ffb703',nose:'beak'},
  pig:{fur:'#ffb6c8',ear:'pointy',in:'#ff8fab',nose:'snout'},
  cat:{fur:'#a3abc0',ear:'pointy',in:'#ffc2d4',nose:'#ff7aa8',muz:'#eef0f6',whisk:1},
  panda:{fur:'#ffffff',ear:'round',in:'#2b2b3a',nose:'#2b2b3a',muz:'#f4f4f8',patch:1},
  mouse:{fur:'#b9b3c9',ear:'big',in:'#ffc2d4',nose:'#ff7aa8',muz:'#ebe7f2',whisk:1}
};
function animal(kind){const a=AN[kind],F=a.fur,I=a.in;let s='',ear='';
  const mir=str=>`<g transform="matrix(-1 0 0 1 100 0)">${str}</g>`;
  if(a.ear==='tall')ear=`<ellipse cx="39" cy="20" rx="8.5" ry="21" fill="${F}" transform="rotate(-12 39 20)"/><ellipse cx="39" cy="22" rx="4" ry="15" fill="${I}" transform="rotate(-12 39 22)"/>`;
  if(a.ear==='round')ear=`<circle cx="27" cy="36" r="11" fill="${a.patch?'#2b2b3a':F}"/>`+(a.patch?'':`<circle cx="27" cy="36" r="6" fill="${I}"/>`);
  if(a.ear==='pointy')ear=`<path d="M25 46 L27 14 L48 33Z" fill="${F}" stroke="${F}" stroke-width="5" stroke-linejoin="round"/><path d="M30 39 L30.5 23 L42 33Z" fill="${I}"/>`;
  if(a.ear==='big')ear=`<circle cx="24" cy="35" r="16" fill="${F}"/><circle cx="24" cy="35" r="10" fill="${I}"/>`;
  if(ear)s+=ear+mir(ear);
  if(a.ear==='spikes'){let d='';for(let i=0;i<=16;i++){const g=Math.PI*(.85+i*1.3/16),r=i%2?45:29;d+=(i?'L':'M')+(50+r*Math.cos(g)).toFixed(1)+' '+(60+r*Math.sin(g)).toFixed(1)}s+=`<path d="${d}Z" fill="${I}" stroke="${I}" stroke-width="3" stroke-linejoin="round"/>`}

}];

/* ---------- engine ---------- */
function renderDots(fin){$('#dots').innerHTML=SCENES.map((s,k)=>`<i class="${k<cur||(fin&&k===cur)?'d':k===cur?'c':''}"></i>`).join('')}
function build(i){clearTimers();party=false;busy=false;$('#replay').classList.remove('show');cur=i;targets=[];done=0;fx.innerHTML='';stage.innerHTML='';
  const s=SCENES[i];SC=s;SEL=mk('div','scene '+s.id,stage);SEL.style.background=s.bg;document.querySelector('meta[name=theme-color]').content=s.tint;s.build(SEL);renderDots();lastAct=Date.now()-5400}
function go(i){const ir=$('#iris');ir.getAnimations().forEach(a=>a.cancel());ir.style.background=SCENES[i].tint;ir.style.display='block';ir.style.opacity=1;SFX.whoosh();
  ir.animate([{transform:'translate(-50%,-50%) scale(0)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:650,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'}).onfinish=()=>{if(started)build(i);
   ir.animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'}).onfinish=()=>{ir.style.display='none';ir.getAnimations().forEach(a=>a.cancel())}}}
function complete(){const s=SCENES[cur],last=cur===SCENES.length-1;s.finale(SEL);rain(last?110:70);SFX.fanfare();cheer(s.cheer);renderDots(true);
  if(last){later(()=>{party=true;$('#replay').classList.add('show')},2800);return}
  later(()=>go(cur+1),4300)}
function hit(t){const [x,y]=fpt(t);if(t.done){t.again&&t.again(x,y,t);return}t.done=true;t.p.classList.add('on');buzz(18);t.tap(x,y,done,t);done++;if(done===targets.length&&!busy){busy=true;later(complete,1100)}}
function hint(){targets.filter(t=>!t.done).sort(()=>Math.random()-.5).slice(0,2).forEach((t,i)=>{const [x,y]=fpt(t);ring(x,y,'#fff',22,900,i*160);ring(x,y,'#fff',22,900,i*160+320);wiggle(t.k,800)})}
setInterval(()=>{if(started&&!busy&&Date.now()-lastAct>7000){hint();lastAct=Date.now()-3800}},400);

stage.addEventListener('pointerdown',e=>{if(!started)return;e.preventDefault();audio();lastAct=Date.now();const x=e.clientX,y=e.clientY;
  const tEl=e.target.closest('.t');if(tEl&&tEl._t){hit(tEl._t);return}
  const toy=e.target.closest('.toy');if(toy&&toy._toy){toy._toy(x,y);return}
  if(party){firework(x,y);return}
  if(SC&&SC.ambient)SC.ambient(x,y);else sparkleAt(x,y)});
document.addEventListener('pointerup',audio);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('resize',()=>{const p=innerHeight>innerWidth;if(p!==portrait){portrait=p;document.querySelectorAll('[data-l]').forEach(place)}});

$('#replay').addEventListener('click',()=>{audio();$('#replay').classList.remove('show');party=false;go(0)});
const hb=$('#homebtn');let holdT=null;
hb.addEventListener('pointerdown',e=>{e.preventDefault();hb.classList.add('hold');holdT=setTimeout(()=>{hb.classList.remove('hold');goHome()},1000)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>hb.addEventListener(ev,()=>{clearTimeout(holdT);hb.classList.remove('hold')}));
function goHome(){started=false;clearTimers();party=false;sel=cur;renderChips();$('#home').classList.remove('hide')}

/* ---------- home ---------- */
$('#play').innerHTML=`<svg viewBox="0 0 100 100"><path d="${starPath(50,54,46,23)}" fill="#fff8d6" stroke="#fff8d6" stroke-width="8" stroke-linejoin="round"/>${face(50,58,20,'#7a3b00',false)}</svg>`;
[[7,11,11,STAR_I,''],[92,13,10,BALLOON('#3a86ff'),''],[8,86,13,FISH('#ffd23f','#ff8c1a',0),''],[91,85,12,GIFT('#3ec46d','#ff4d6d'),''],[12,48,11,SCENES[1].icon,' side'],[88,46,12,animal('bunny'),' side']].forEach(([x,y,w,svg,c],i)=>{const d=mk('div','hdeco'+c,$('#home'),`<div class="in" style="animation-delay:${-i*.7}s">${svg}</div>`);d.style.cssText=`left:${x}%;top:${y}%;width:${w}vmin`});
function renderChips(){$('#chips').innerHTML=SCENES.map((s,k)=>`<button class="chip${k===sel?' sel':''}" data-i="${k}" aria-label="Акт ${k+1}: ${s.name}" title="Акт ${k+1}: ${s.name}">${s.icon}</button>`).join('')}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;sel=+b.dataset.i;renderChips();audio();SFX.chime(sel)});
function renderSnd(){$('#snd').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="#3b1d5e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d5e"/>${muted?'<path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>'}</svg>${muted?'Звук выключен':'Звук включён'}`}
$('#snd').addEventListener('click',()=>{muted=!muted;renderSnd();audio();SFX.chime(4)});
$('#fs').addEventListener('click',()=>{try{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});else if(d.webkitRequestFullscreen)d.webkitRequestFullscreen()}catch(e){}});
$('#play').addEventListener('click',()=>{audio();SFX.chime(5);$('#home').classList.add('hide');started=true;build(sel)});

function start(data){sel=Math.min(SCENES.length-1,Math.max(0,+(data&&data.scene)||0));renderChips();renderSnd()}
window.claude?.hot?.snapshot?.(()=>({scene:cur}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
