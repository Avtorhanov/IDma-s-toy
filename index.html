<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241c6b">
<meta name="description" content="Игрушка для малышей: нажимай на звёздочки, цветочки и шарики, и всё оживает.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Игрушка">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Игрушка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a toy for toddlers, bright, round and wordless
   IDEA a busy-board stand with six little theatres; each act wakes up when its spots are tapped
   PICTURE the whole screen is the scene: sleepy stars, buds, balloons, bushes, shells, a birthday cake
   COLOUR every act owns one saturated sky; gold, pink, leaf green and sea blue accents; white sparkles
   TYPE Nunito 900 for the title and cheers, Nunito 800 for parent labels
   LAYOUT scene fills the screen; spots placed separately for landscape and portrait; tiny home and progress on top */
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0;touch-action:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;overflow:hidden;background:#241c6b;color:#fff;font:800 16px/1.4 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#stage,#fx,#ui,#home{position:fixed;inset:0}
#stage{overflow:hidden}
#fx{pointer-events:none;z-index:5;overflow:hidden}
#ui{z-index:7;pointer-events:none}
#ui button{pointer-events:auto}
.scene{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;left:0;bottom:0;width:100%;display:block;pointer-events:none}
.p{position:absolute;left:var(--x);top:var(--y);width:var(--w);transform:translate(-50%,-50%)}
.p svg{display:block;width:100%;height:auto;overflow:visible}
.in,.sq,.k{position:relative}
.sq{transform-origin:50% 85%}
.eye{transition:transform .22s ease-out}
.bl{transform-box:fill-box;transform-origin:center;animation:eblink var(--bk,5s) ease-in-out infinite;animation-delay:var(--bd,0s)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer .p:not(.deco),.layer .cat{pointer-events:auto}
.t{cursor:pointer;z-index:2}
.t::before{content:"";position:absolute;inset:-3vmin}
.deco{pointer-events:none}
.pt{position:absolute;display:block;pointer-events:none}
.pt svg{display:block;width:100%;height:100%;overflow:visible}
.dot{border-radius:50%}
.rect{border-radius:2px}
.star,.mini,#dots i.d{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.leaf{border-radius:0 80% 0 80%}
.ring{border-radius:50%;border:.7vmin solid #fff}
.bub{border-radius:50%;border:2px solid rgba(255,255,255,.85);background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.8),rgba(255,255,255,.12) 45%,rgba(255,255,255,.05))}
.comet{background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:99px;transform-origin:100% 50%}
.comet::after{content:"";position:absolute;right:-1.8vmin;top:50%;width:3.6vmin;height:3.6vmin;margin-top:-1.8vmin;background:#fff6c4;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.cheer{position:absolute;left:50%;top:38%;font:900 clamp(56px,17vmin,150px)/1 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;white-space:nowrap;text-shadow:0 .05em 0 #ff4d6d,0 .1em 0 #3a86ff,0 .15em 0 #ffd23f}
.tw{position:absolute;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
.mini{position:absolute;width:4.5vmin;height:4.5vmin;background:#ffe27a;animation:twinkle 2s ease-in-out infinite;pointer-events:none}
/* faces */
.sl{transition:opacity .25s}
.aw{opacity:0;transition:opacity .25s}
.on .aw{opacity:1}
.on .sl{opacity:0}
/* night */
.sb{fill:#686eb8;stroke:#686eb8;transition:fill .3s,stroke .3s}
.on .sb{fill:#ffd34d;stroke:#ffc21a}
.halo{opacity:0;transition:opacity .4s}
.on .halo{animation:halo 1.8s ease-in-out infinite}
.nstar .in{animation:float 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
.nstar.on .in{animation:pulse 1.6s ease-in-out infinite}
.moon .in{animation:float 6s ease-in-out infinite}
.z{font:900 13px Nunito,sans-serif;fill:#fff;opacity:0;animation:zz 2.4s ease-out infinite}
.on .zz{display:none}
/* garden */
.rays{transform-origin:50px 50px;animation:spin 26s linear infinite}
.cloud{position:absolute;left:0;pointer-events:none;animation:drift linear infinite}
.cloud svg{display:block;width:100%}
.rainbow path{stroke-dasharray:1 1.5;stroke-dashoffset:1.02;transition:stroke-dashoffset 1.4s ease-out}
.rainbow.on path{stroke-dashoffset:0}
.flower .in{animation:sway 4.5s ease-in-out infinite;animation-delay:var(--dl,0s);transform-origin:50% 100%}
.flower .k{transform-origin:50% 100%}
.bloom{transform:scale(0) rotate(-120deg);transform-origin:50px 55px;transition:transform .8s cubic-bezier(.34,1.56,.64,1)}
.on .bloom{transform:none}
.bud{transform-origin:50px 62px;transition:transform .3s,opacity .3s}
.on .bud{transform:scale(.2);opacity:0}
.w{transform-origin:30px 25px;animation:flap .22s ease-in-out infinite}
/* balloons */
.bal .in{animation:float var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.friend .in{animation:hop 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
/* bushes */
.bush .in{animation:rustle 5s ease-in-out infinite;animation-delay:var(--dl,0s);transform-origin:50% 100%}
.bush .k>svg,.gift .k>svg{position:relative}
.peek{transform-origin:60px 62px;animation:blink 3.2s infinite}
.on .peek{opacity:0}
.ani{position:absolute;left:18%;width:64%;bottom:42%;opacity:0;transform:translateY(40%) scale(.7);transition:transform .6s cubic-bezier(.34,1.7,.5,1),opacity .15s}
.ani svg{display:block;width:100%}
.on .ani{opacity:1;transform:translateY(-36%)}
/* sea */
.ray{position:absolute;top:-10%;height:78%;width:14vmax;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));transform:skewX(-18deg);animation:rayf 5s ease-in-out infinite alternate;pointer-events:none}
.weed{position:absolute;pointer-events:none;transform-origin:50% 100%;animation:sway2 3.2s ease-in-out infinite}
.weed svg{display:block;width:100%}
.lid{transform-origin:12px 60px;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.on .lid{transform:rotate(-34deg)}
.pearl,.glow{opacity:0;transform:scale(.3);transform-origin:60px 64px;transition:opacity .4s .15s,transform .5s .15s}
.on .pearl{opacity:1;transform:none}
.on .glow{transform:none;animation:halo 1.6s ease-in-out infinite}
.fishy .in{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
.dir svg{display:block;width:100%}
.spout{transform-origin:150px 24px;animation:spout .9s ease-in-out infinite}
/* party */
.bunt{position:absolute;top:0;left:0;width:100%;height:14vmin;pointer-events:none}
.table{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#f4c98f,#d99a5f);border-top:1.4vmin solid #ffe1b3;pointer-events:none}
.candle::before{inset:-5vmin -3vmin -2vmin}
.flame{transform-origin:15px 30px;transform:scale(0);transition:transform .45s cubic-bezier(.34,1.8,.6,1)}
.on .flame{transform:none}
.on .fl{transform-origin:15px 30px;animation:flick .35s ease-in-out infinite alternate}
.on .gl{animation:halo 1.3s ease-in-out infinite}
.gift .ani{left:16%;width:68%;bottom:34%;transform:translateY(45%) scale(.6);transition-delay:.2s}
.gift.on .ani{transform:translateY(-50%)}
.gift .lid{transform-box:fill-box;transform-origin:50% 50%;transition:none}
.gift.on .lid{transform:none}
/* ui */
#iris{position:fixed;left:50%;top:50%;width:300vmax;height:300vmax;border-radius:50%;z-index:8;pointer-events:none;display:none;transform:translate(-50%,-50%) scale(0)}
.cbtn{position:absolute;top:calc(12px + env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.2);display:grid;place-items:center;cursor:pointer}
#homebtn{left:calc(12px + env(safe-area-inset-left))}
#fsbtn{right:calc(12px + env(safe-area-inset-right));display:none}
body.fsok.playing #fsbtn{display:grid}
.cbtn svg{width:40px;height:40px}
.cbtn .rg{stroke-dasharray:139;stroke-dashoffset:139}
.cbtn.hold .rg{stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
#fsbtn .fx2{display:none}
body.full #fsbtn .fx1{display:none}
body.full #fsbtn .fx2{display:inline}
#dots{position:absolute;top:calc(24px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px}
#sub{position:absolute;top:calc(46px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:7px}
#sub i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,transform .3s}
#sub i.c{background:#fff}
#sub i.d{background:#ffd34d;transform:scale(1.25)}
#dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.38)}
#dots i.c{background:#fff;transform:scale(1.35)}
#dots i.d{width:16px;height:16px;border-radius:0;background:#ffd34d}
#replay{position:absolute;left:50%;top:21%;width:min(22vmin,170px);aspect-ratio:1;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:radial-gradient(circle at 36% 30%,#fff2a8,#ffc21a 70%);box-shadow:0 1.2vmin 0 #d98900;transform:translate(-50%,-50%) scale(0);transition:transform .5s cubic-bezier(.34,1.7,.5,1);cursor:pointer}
#replay.show{transform:translate(-50%,-50%) scale(1)}
#replay svg{width:66%;height:66%;display:block;animation:spin 3s linear infinite}
#home{z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.6vmin,20px);padding:16px;background:radial-gradient(120% 90% at 50% 18%,#ffd84d 0%,#ff8db8 48%,#7a5cff 100%);transition:opacity .45s;overflow:hidden}
#home.hide{opacity:0;pointer-events:none}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%}
.ttl[hidden],#nameform[hidden]{display:none}
#namebtn{flex:none;width:40px;height:40px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.6);display:grid;place-items:center;cursor:pointer}
#namebtn svg{width:22px;height:22px}
#nameform{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.nlbl{font:900 clamp(26px,6vmin,46px)/1.1 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;text-shadow:0 .05em 0 #e2457f,0 .1em 0 #5b3cc4}
#nameinp{width:min(12em,60vw);min-height:44px;padding:0 16px;border:3px solid #7a5cff;border-radius:22px;background:#fff;color:#3b1d5e;font:800 17px Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;-webkit-user-select:text;user-select:text;touch-action:manipulation;outline:none}
#nameinp::placeholder{color:#a99bc9}
#nameform button{min-height:44px;padding:0 18px;border:0;border-radius:22px;background:#7a5cff;color:#fff;font-size:15px;cursor:pointer}
#namebtn:focus-visible,#nameform button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#home h1{margin:0;font:900 clamp(32px,7.5vmin,58px)/1.05 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:-.01em;text-align:center;text-wrap:balance;text-shadow:0 .05em 0 #e2457f,0 .1em 0 #5b3cc4}
#home p{margin:0;max-width:30em;text-align:center;font-size:clamp(14px,2.4vmin,17px);color:#3b1d5e;text-wrap:balance}
#play{width:clamp(104px,32vmin,230px);aspect-ratio:1;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,#fff6b8,#ffd34d 55%,#ffb703);box-shadow:0 1.4vmin 0 #d98900;cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
#play svg{width:84%;height:84%;display:block}
.hdeco{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.hdeco .in{animation:float 4.2s ease-in-out infinite}
.hdeco svg{display:block;width:100%;height:auto}
@media (orientation:portrait){.hdeco.side{display:none}}
#play:active{transform:translateY(1vmin)}
.lbl,.note{font-size:14px;color:#3b1d5e}
.note{font-size:13px;opacity:.85;text-align:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{width:clamp(46px,8.5vmin,62px);aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:rgba(255,255,255,.5);padding:8px;cursor:pointer;display:grid;place-items:center}
.chip svg{width:100%;height:100%;display:block}
.chip.sel{background:#fff;border-color:#7a5cff}
.chip:focus-visible,.opt:focus-visible,#play:focus-visible{outline:3px solid #fff;outline-offset:3px}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.opt{min-height:44px;padding:0 16px;border:0;border-radius:22px;background:rgba(255,255,255,.75);color:#3b1d5e;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer}
.opt svg{width:22px;height:22px}
@media (max-height:460px){#home p,.note{display:none}#play{width:clamp(96px,26vmin,200px)}#home{gap:8px}}
.seg{display:flex;border-radius:22px;background:rgba(255,255,255,.45);padding:3px}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:19px;background:transparent;color:#3b1d5e;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button svg{width:20px;height:20px}
.seg button.sel{background:#fff;box-shadow:0 2px 0 rgba(91,60,196,.35)}
.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#fsnote{max-width:34em;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.85);color:#3b1d5e;font-size:14px;text-align:center;text-wrap:balance}
#fsnote[hidden]{display:none}
#fsnote a{color:#5b3cc4}
/* guide, hand, gestures */
#guide{position:fixed;left:0;top:0;width:max(54px,12vmin);z-index:9;pointer-events:none;display:none}
#guide .gin{animation:float 3.6s ease-in-out infinite}
#guide svg{display:block;width:100%;height:auto;overflow:visible}
.hand{position:absolute;left:0;top:0;pointer-events:none;z-index:6;filter:drop-shadow(0 .6vmin .8vmin rgba(40,20,90,.35))}
.hand svg{display:block;width:100%;height:auto}
.ghost{position:absolute;left:0;top:0;pointer-events:none;opacity:.55}
.ghost svg{display:block;width:100%;height:auto}
.hring{position:absolute;left:0;top:0;pointer-events:none}
.hring svg{display:block;width:100%;height:100%;overflow:visible}
.hglow{position:absolute;left:50%;top:var(--gy,50%);width:var(--gw,95%);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1.1vmin solid var(--gc);box-shadow:0 0 3vmin var(--gc),inset 0 0 3vmin var(--gc);animation:gpulse 1.1s ease-in-out infinite;pointer-events:none;z-index:-1}
.near .hglow{border-width:1.8vmin;animation-duration:.5s}
.cat{position:absolute;left:0;top:0;cursor:pointer;z-index:3}
.cat::before{content:"";position:absolute;inset:-4vmin}
.cat .k>svg{display:block;width:100%;height:auto;overflow:visible}
.dragit{cursor:grab}
.dragit.cur .sq{animation:invite 1.3s ease-in-out infinite}
.dragging{z-index:6!important}
.dragging .sq{animation:none;transform:scale(1.15)}
.act .sq{animation:actp .9s ease-in-out infinite}
.act .k{filter:drop-shadow(0 0 2.2vmin #fff)}
.mound{position:absolute;left:22%;width:56%;bottom:-4%;z-index:-1;pointer-events:none}
.mound svg{display:block;width:100%}
.sprout .k{transition:transform .12s linear}
.bal2 .k{transform-origin:50% 100%;transition:transform .12s linear}
.bal2.full .in{animation:float 3.6s ease-in-out infinite}
.bfly .w{animation-duration:.3s}
.bfly.rest .w{animation-duration:.9s}
.fb .peek{opacity:0}
.fb.pk .peek{opacity:1}
.fb.on .peek{opacity:0}
.candle.out .flame{transform:scale(0)}
.can{position:absolute;left:0;top:0;pointer-events:none;transform-origin:97% 25%}
.can svg{display:block;width:100%}
.num{position:absolute;left:0;top:0;font:900 clamp(40px,12vmin,110px)/1 Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;text-shadow:0 .05em 0 #ff4d6d,0 .1em 0 #3a86ff;pointer-events:none}
/* motion */
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.4vmin) rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes halo{0%,100%{opacity:.18}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(130vw)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sway2{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes rustle{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}92%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-22px);opacity:0}}
@keyframes hop{0%,78%,100%{transform:translateY(0)}86%{transform:translateY(-22%)}93%{transform:translateY(0) scale(1.06,.94)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5vmin,-1.6vmin)}}
@keyframes rayf{from{opacity:.3}to{opacity:.85}}
@keyframes spout{0%,100%{transform:scale(.6)}50%{transform:scale(1.1)}}
@keyframes eblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes gpulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes invite{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.1) rotate(-5deg)}60%{transform:scale(1.06) rotate(4deg)}}
@keyframes actp{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@media (prefers-reduced-motion:reduce){.in,.cloud,.rays,.tw,.weed,.ray,#play,#replay svg,#guide .gin{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="pg" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fbeaff"/><stop offset="1" stop-color="#d4bdf0"/></radialGradient></defs></svg>
<div id="stage"></div>
<div id="fx"></div>
<div id="iris"></div>
<div id="ui">
  <button id="fsbtn" class="cbtn" aria-label="Полный экран"><svg viewBox="0 0 48 48"><circle class="rg" cx="24" cy="24" r="22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" transform="rotate(-90 24 24)"/><path class="fx1" d="M13 20V13h7M35 20V13h-7M13 28v7h7M35 28v7h-7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path class="fx2" d="M20 13v7h-7M28 13v7h7M20 35v-7h-7M28 35v-7h7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="sub"></div>
  <button id="homebtn" class="cbtn" aria-label="В меню: удерживайте секунду"><svg viewBox="0 0 48 48"><circle class="rg" cx="24" cy="24" r="22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" transform="rotate(-90 24 24)"/><path d="M14 23 L24 14 L34 23 V34 H27 V27 H21 V34 H14Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <div id="dots"></div>
  <button id="replay" aria-label="Ещё раз"><svg viewBox="0 0 100 100"><path d="M78 50 A28 28 0 1 1 64 25.8" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M56 12 L80 24 L58 40Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></button>
</div>
<div id="guide"><div class="gin"><div class="gk"></div></div></div>
<div id="home">

<script>
{

function mk(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function place(e){const v=(portrait?e.dataset.p:e.dataset.l).split(',').map(Number);e.style.setProperty('--x',v[0]+'%');e.style.setProperty('--y',v[1]+'%');if(v[2])e.style.setProperty('--w',v[2]+'vmin')}

function face(cx,cy,r,ink,sleepy=true){const e=r*.32,w=(r*.1).toFixed(2),q=(v)=>v.toFixed(1);
  let s='<g>';
  if(sleepy)s+=`<g class="sl"><path d="M${q(cx-e-r*.17)} ${q(cy)} q${q(r*.17)} ${q(r*.17)} ${q(r*.34)} 0 M${q(cx+e-r*.17)} ${q(cy)} q${q(r*.17)} ${q(r*.17)} ${q(r*.34)} 0" stroke="${ink}" stroke-width="${w}" fill="none" stroke-linecap="round"/><path d="M${q(cx-r*.1)} ${q(cy+r*.4)} h${q(r*.2)}" stroke="${ink}" stroke-width="${w}" stroke-linecap="round"/></g>`;

  if(a.ear==='tuft')s+=`<path d="M50 32 C46 20 50 14 55 12 M50 32 C52 22 58 18 65 20" stroke="${I}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  s+=`<circle cx="50" cy="60" r="30" fill="${F}"/><path d="M21 64 A30 30 0 0 0 79 64 A32 20 0 0 1 21 64Z" fill="#2b2140" opacity=".08"/><ellipse cx="38" cy="42" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-25 38 42)"/>`;
  if(a.muz)s+=`<ellipse cx="50" cy="71" rx="14" ry="10" fill="${a.muz}"/>`;

  if(a.ear!=='frog'){if(a.patch)s+=[39,61].map(x=>`<g class="bl"><circle cx="${x}" cy="57" r="4.3" fill="#fff"/><g class="eye" data-m="1.6"><circle cx="${x+.5}" cy="57.5" r="2.2" fill="#2b2140"/></g></g>`).join('');
    else s+=[39,61].map(x=>`<g class="eye" data-m="1.7"><g class="bl"><circle cx="${x}" cy="57" r="4.3" fill="#2b2140"/><circle cx="${x+1.4}" cy="55.6" r="1.5" fill="#fff"/></g></g>`).join('')}

  else if(a.nose==='snout')s+=`<ellipse cx="50" cy="70" rx="11" ry="8" fill="${I}"/><ellipse cx="46" cy="70" rx="2" ry="3" fill="#c2507a"/><ellipse cx="54" cy="70" rx="2" ry="3" fill="#c2507a"/><path d="M45 81 Q50 85 55 81" stroke="#2b2140" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;

/* ---------- sound ---------- */
let AC=null,OUT=null,NB=null;
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();const comp=AC.createDynamicsCompressor();OUT=AC.createGain();OUT.gain.value=.55;OUT.connect(comp);comp.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume().catch(()=>{})}catch(e){}}
function tone(f,o={}){if(!AC||muted)return;const t0=AC.currentTime+(o.t||0),d=o.d||.3,v=o.v||.2;const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.a||.01));g.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(g);g.connect(OUT);os.start(t0);os.stop(t0+d+.05)}
function hiss(o={}){if(!AC||muted)return;const t0=AC.currentTime+(o.t||0),d=o.d||.2;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f||1500,t0);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+d);const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.v||.3,t0+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(OUT);s.start(t0,Math.random()*.8);s.stop(t0+d+.05)}
const N=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760];
const SFX={
  tick(){tone(pick(N)/2,{d:.2,v:.08,type:'triangle'})},
  chime(i=0,t=0){const f=N[i%N.length];tone(f,{t,d:1.1,v:.2});tone(f*2,{t,d:.6,v:.05,type:'triangle'});tone(f*3.01,{t,d:.35,v:.025})},
  sparkle(){for(let k=0;k<4;k++)tone(pick(N)*2,{t:k*.06,d:.25,v:.04})},
  pop(){hiss({d:.09,v:.6,f:1600,q:.6});tone(600,{f2:90,d:.14,v:.3,type:'triangle'})},
  boing(p=1){tone(200*p,{f2:700*p,d:.22,v:.2});tone(700*p,{t:.16,f2:350*p,d:.22,v:.13})},
  giggle(p=1){[0,1,0,1,2].forEach((s,k)=>tone(N[s+3]*p,{t:k*.07,d:.09,v:.08,type:'triangle'}))},
  bloom(i){tone(260,{f2:820,d:.3,v:.12,type:'triangle'});SFX.chime(i,.18)},
  bubble(v=.12){for(let k=0;k<4;k++){const f=R(380,700);tone(f,{t:k*.08,f2:f*2.4,d:.09,v})}},
  whoosh(){hiss({d:.9,v:.18,f:500,f2:3500,q:.7,a:.3})},
  rustle(){hiss({d:.3,v:.22,f:3200,q:.4})},
  flame(i){hiss({d:.25,v:.16,f:900,f2:2400,q:.5});SFX.chime(i+2,.12)},
  fanfare(){[0,2,3,5].forEach((s,k)=>tone(N[s],{t:k*.13,d:.4,v:.12,type:'triangle'}));[5,7,8].forEach(s=>tone(N[s],{t:.55,d:1.2,v:.07,type:'triangle'}));tone(N[5]/2,{t:.55,d:1.2,v:.1})},
  firework(){tone(500,{f2:1500,d:.45,v:.03});hiss({t:.5,d:.7,v:.4,f:260,q:.4});for(let k=0;k<6;k++)hiss({t:.62+k*.07,d:.05,v:.1,f:5000,q:1})},
  pick(){tone(420,{f2:780,d:.14,v:.12,type:'triangle'})},
  boop(){tone(340,{f2:190,d:.24,v:.12,type:'triangle'})},
  empty(){tone(392,{d:.18,v:.1,type:'triangle'});tone(294,{t:.17,d:.3,v:.1,type:'triangle'})},
  tada(){[0,2,4,7].forEach((s,k)=>tone(N[s],{t:k*.09,d:.4,v:.1,type:'triangle'}))},
  puff(){hiss({d:.4,v:.3,f:800,f2:250,q:.5,a:.03})},
  drop(){const f=R(1000,1400);tone(f,{f2:f*.45,d:.09,v:.04})},
  air(){hiss({d:.18,v:.08,f:2600,q:.6})},
  note(i){const f=[N[0],N[2],N[4],N[5]][i%4];tone(f,{d:.6,v:.16,type:'triangle'});tone(f*2,{d:.35,v:.04})},
  melody(){let t=0;[[3,.18],[4,.18],[5,.36],[4,.18],[5,.18],[6,.18],[7,.5],[5,.18],[7,.18],[8,.9]].forEach(([s,d])=>{tone(N[s],{t,d:d+.25,v:.12,type:'triangle'});tone(N[s]/2,{t,d:d+.2,v:.05});t+=d})}
};

/* ---------- particles ---------- */
function part(x,y,s,cls,color,kf,dur,delay=0,ease='cubic-bezier(.15,.7,.3,1)',h){
  const d=document.createElement('i');d.className='pt '+cls;const hh=h||(cls==='rect'?s*.55:s);
  let css=`left:${x-s/2}px;top:${y-hh/2}px;width:${s}px;height:${hh}px;`;
  if(cls==='ring')css+=`border-color:${color};`;else if(cls==='heart')d.innerHTML=HEART(color);else if(color)css+=`background:${color};`;
  d.style.cssText=css;fx.appendChild(d);
  d.animate(kf,{duration:dur,delay,easing:ease,fill:'backwards'}).onfinish=()=>d.remove();return d}
function burst(x,y,o={}){const n=o.n||18,cols=o.colors||PAL,shapes=o.shapes||['dot','star'],rad=(o.r||22)*U(),sz=(o.size||2.6)*U(),g=o.g??.5;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=rad*R(.45,1),dx=Math.cos(a)*r,dy=Math.sin(a)*r,s=sz*R(.6,1.3),rot=R(-360,360);
    part(x,y,s,pick(shapes),pick(cols),[{transform:'translate(0,0) scale(.3)',opacity:1},{transform:`translate(${dx*.75}px,${dy*.75}px) scale(1) rotate(${rot/2}deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy+rad*g}px) scale(.4) rotate(${rot}deg)`,opacity:0}],(o.d||1000)*R(.75,1.25))}}
function ring(x,y,c='#fff',size=18,d=700,delay=0){part(x,y,size*U(),'ring',c,[{transform:'scale(.3)',opacity:.95},{transform:'scale(1.6)',opacity:0}],d,delay,'ease-out')}
function bubble(x,y,s,dur,rise){part(x,y,s,'bub','',[{transform:'translate(0,0) scale(.4)',opacity:0},{transform:`translate(${R(-10,10)}px,${-rise*.15}px) scale(1)`,opacity:1,offset:.15},{transform:`translate(${R(-30,30)}px,${-rise}px) scale(1.1)`,opacity:0}],dur,0,'ease-in')}
function bubbles(x,y,n=8){for(let k=0;k<n;k++)bubble(x+R(-4,4)*U(),y,R(2,5)*U(),R(1300,2200),innerHeight*R(.25,.5))}
function rain(n=70){const W=innerWidth,H=innerHeight;for(let i=0;i<n;i++){const dx=R(-60,60),rot=R(360,1080);part(R(0,W),-20,R(1.6,2.8)*U(),pick(['rect','rect','dot','star']),pick(PAL),[{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx}px,${H*.5}px) rotate(${rot/2}deg)`,offset:.5},{transform:`translate(${-dx}px,${H+40}px) rotate(${rot}deg)`}],R(2200,3600),R(0,700),'linear')}}
function firework(x,y){const H=innerHeight,c=pick(PAL),c2=pick(PAL);
  part(x,H+10,1.4*U(),'dot','#fff',[{transform:'translate(0,0)',opacity:1},{transform:`translate(0,${y-H-10}px)`,opacity:.9}],520,0,'cubic-bezier(.2,.6,.4,1)');
  setTimeout(()=>{burst(x,y,{n:34,colors:[c,c2,'#fff'],r:30,g:.35,d:1400,size:2.1});ring(x,y,c,26,800)},500);SFX.firework()}
function cheer(txt){const c=mk('div','cheer',fx);c.textContent=txt;c.animate([{transform:'translate(-50%,-50%) scale(0) rotate(-12deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.15) rotate(4deg)',opacity:1,offset:.12},{transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1,offset:.2},{transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1,offset:.85},{transform:'translate(-50%,-50%) scale(1.3)',opacity:0}],{duration:2600,easing:'ease-out'}).onfinish=()=>c.remove()}
function butterfly(x,y){const c=pick(PAL),c2=pick(PAL),s=9*U(),dir=pick([-1,1]),drift=R(80,220),amp=R(30,70);

/* eyes follow the finger (or whatever is interesting right now) */
let gz=null,gzU=0,eyeRaf=0;
function lookAt(x,y,ms=2000){gz=[x,y];gzU=Date.now()+ms;if(!eyeRaf)eyeRaf=requestAnimationFrame(()=>{eyeRaf=0;eyes()})}
function eyes(){const on=gz&&Date.now()<gzU,lim=6*U();
  document.querySelectorAll('#stage .eye,#guide .eye').forEach(e=>{
    if(!on){if(e._o){e.style.transform='';e._o=0}return}
    const r=e.getBoundingClientRect();if(!r.width)return;
    let dx=gz[0]-(r.left+r.width/2),dy=gz[1]-(r.top+r.height/2);const d=Math.hypot(dx,dy)||1,m=(+e.dataset.m||1.5)*Math.min(1,d/lim);
    if(e.closest('.flip'))dx=-dx;
    e.style.transform=`translate(${(dx/d*m).toFixed(2)}px,${(dy/d*m).toFixed(2)}px)`;e._o=1})}
setInterval(()=>{if(started)eyes()},180);

/* the guide: a little star that travels through every act */
const G=$('#guide'),GK=G.querySelector('.gk');GK.innerHTML=GUIDE;lively(G);
let gA=null,gx=0,gy=0,gRet=0;
const GT=(x,y)=>{const w=G.offsetWidth||60;return `translate(${(x-w/2).toFixed(1)}px,${(y-w/2).toFixed(1)}px)`};
function gpos(){const r=G.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function gfly(x,y,dur=850){const [cx,cy]=gA?gpos():[gx,gy];if(gA){gA.cancel();gA=null}G.style.transform=GT(x,y);gx=x;gy=y;if(dur<=0)return;
  gA=G.animate(EZ([{transform:GT(cx,cy)},{transform:GT((cx+x)/2,Math.min(cy,y)-7*U())},{transform:GT(x,y)}]),{duration:dur});gA.onfinish=()=>{gA=null}}

    if(r<.38)hopS(s);else if(r<.66)jelly(s);else if(r<.82)wiggle(s,700);else a.querySelectorAll('.bl').forEach(b=>b.animate([{transform:'scaleY(1)'},{transform:'scaleY(.1)'},{transform:'scaleY(1)'},{transform:'scaleY(.1)'},{transform:'scaleY(1)'}],{duration:520}))}}

function renderSnd(){$('#snd').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="#3b1d5e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3b1d5e"/>${muted?'<path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>'}</svg>${muted?'Звук выключен':'Звук включён'}`}
$('#snd').addEventListener('click',()=>{muted=!muted;renderSnd();audio();SFX.chime(4)});
function renderModes(){document.querySelectorAll('#modes button').forEach(b=>{const on=b.dataset.m===mode;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)})}
$('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;try{localStorage.setItem('stend-mode',mode)}catch(err){}renderModes();audio();SFX.chime(mode==='dev'?6:2)});
/* the title: «Игрушка» plus the child's name, e.g. «Игрушка Айдимы» */
let kid='';
const fullName=()=>'Игрушка'+(kid?' '+kid:'');
function renderName(){$('#ttl').textContent=fullName();document.title=fullName();document.querySelector('meta[name=apple-mobile-web-app-title]').content=fullName();$('#namebtn').setAttribute('aria-label',kid?'Изменить имя в названии':'Добавить имя в название')}
function nameEdit(on){$('.ttl').hidden=on;$('#nameform').hidden=!on;if(on){$('#nameinp').value=kid;$('#nameinp').focus()}}
function nameSave(){kid=$('#nameinp').value.replace(/\s+/g,' ').trim().slice(0,24);try{localStorage.setItem('stend-name',kid)}catch(err){}renderName();nameEdit(false);$('#nameinp').blur()}
$('#namebtn').addEventListener('click',()=>{audio();nameEdit(true)});
$('#nameform').addEventListener('submit',e=>{e.preventDefault();nameSave();audio();SFX.chime(5)});
$('#play').addEventListener('click',()=>{if(!$('#nameform').hidden)nameSave();audio();SFX.chime(5);$('#fsnote').hidden=true;$('#home').classList.add('hide');started=true;document.body.classList.add('playing');G.style.display='block';gfly(innerWidth/2,innerHeight*.78,0);build(sel)});

function start(data){sel=Math.min(SCENES.length-1,Math.max(0,+(data&&data.scene)||0));
  let m=data&&data.mode;if(!m){try{m=localStorage.getItem('stend-mode')}catch(e){}}mode=m==='simple'?'simple':'dev';
  let k=data&&data.kid;if(k==null){try{k=localStorage.getItem('stend-name')}catch(e){}}kid=(k||'').slice(0,24);
  renderChips();renderSnd();renderModes();renderFs();renderName()}
window.claude?.hot?.snapshot?.(()=>({scene:cur,mode,kid}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
</body>
